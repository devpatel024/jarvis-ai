name: jarvis
description: Local-first personal assistant.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.38.4'
dependencies:
  drift: 2.35.2
  flutter:
    sdk: flutter
  flutter_riverpod: 3.4.3
  path_provider: 2.1.6
  sqlite3: 3.7.0
dev_dependencies:
  build_runner: 2.16.2
  drift_dev: 2.35.1
  flutter_lints: 6.0.0
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
  assets:
    - assets/licenses/JNI-NATIVE.txt
    - assets/fonts/SpaceGrotesk-OFL.txt
    - assets/fonts/NotoSansGujarati-OFL.txt
    - assets/fonts/JetBrainsMono-OFL.txt
  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk.ttf
          weight: 300
        - asset: assets/fonts/SpaceGrotesk.ttf
          weight: 400
        - asset: assets/fonts/SpaceGrotesk.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk.ttf
          weight: 600
        - asset: assets/fonts/SpaceGrotesk.ttf
          weight: 700
    - family: NotoSansGujarati
      fonts:
        - asset: assets/fonts/NotoSansGujarati.ttf
          weight: 300
        - asset: assets/fonts/NotoSansGujarati.ttf
          weight: 400
        - asset: assets/fonts/NotoSansGujarati.ttf
          weight: 500
        - asset: assets/fonts/NotoSansGujarati.ttf
          weight: 600
        - asset: assets/fonts/NotoSansGujarati.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono.ttf
          weight: 300
        - asset: assets/fonts/JetBrainsMono.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono.ttf
          weight: 600
        - asset: assets/fonts/JetBrainsMono.ttf
          weight: 700
